<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IEM · Consolidado de carga</title>
  <link rel="icon" href="favicon-32.png" sizes="32x32" />
  <style>
    :root { --c-bg:#0f172a; --c-card:#1e293b; --c-border:#334155; --c-text:#f1f5f9; --c-muted:#94a3b8; --c-pri:#3B6EA5; --c-ok:#16a34a; --c-bad:#dc2626; }
    body.cons-page { margin:0; background:var(--c-bg); color:var(--c-text); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; }
    body.cons-page.light-theme { --c-bg:#f8fafc; --c-card:#fff; --c-border:#e2e8f0; --c-text:#0f172a; --c-muted:#64748b; }
    .cons-wrap { max-width:1100px; margin:0 auto; padding:1rem 1rem 4rem; }
    .cons-head { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between; margin-bottom:1rem; }
    .cons-head h1 { margin:0; font-size:1.25rem; }
    .cons-card { background:var(--c-card); border:1px solid var(--c-border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
    .cons-actions { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .cons-status { font-size:.85rem; color:var(--c-muted); margin:.35rem 0; }
    .btn { cursor:pointer; border-radius:10px; border:1px solid var(--c-border); background:transparent; color:var(--c-text); padding:.5rem .85rem; font:inherit; font-size:.88rem; }
    .btn-primary { background:var(--c-pri); border-color:var(--c-pri); color:#fff; font-weight:600; }
    .btn-outline { background:transparent; }
    .btn-sm { padding:.4rem .7rem; font-size:.82rem; }
    .btn-danger { border-color:var(--c-bad); color:#fecaca; }
    select { padding:.45rem .65rem; border-radius:10px; border:1px solid var(--c-border); background:var(--c-bg); color:var(--c-text); font:inherit; }
    .cons-fecha-badge { display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .75rem; border-radius:999px; background:rgba(59,110,165,.2); border:1px solid var(--c-pri); font-size:.85rem; font-weight:600; }
    .cons-toolbar-main { display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0; }
    .cons-table-wrap { overflow:auto; max-height:42vh; border:1px solid var(--c-border); border-radius:12px; }
    .cons-preview-wrap {
      overflow: auto;
      max-height: min(70vh, 900px);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      background: #525659;
      padding: 12px 8px 20px;
    }
    body.light-theme .cons-preview-wrap { background: #94a3b8; }
    .cons-preview-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform-origin: top center;
    }
    .cons-preview-inner .print-page {
      width: 210mm;
      max-width: 100%;
      box-sizing: border-box;
      background: #fff;
      color: #0f172a;
      padding: 10mm 12mm;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      border-radius: 2px;
    }
    .cons-preview-empty {
      color: #e2e8f0;
      text-align: center;
      padding: 2.5rem 1rem;
      font-size: 0.9rem;
    }
    body.light-theme .cons-preview-empty { color: #0f172a; }

    .cons-table { width:100%; border-collapse:collapse; font-size:.82rem; }
    .cons-table th, .cons-table td { padding:.4rem .5rem; border-bottom:1px solid var(--c-border); text-align:left; white-space:nowrap; }
    .cons-table th { position:sticky; top:0; background:var(--c-card); z-index:1; }
    .badge-frio { color:#38bdf8; font-weight:700; }
    .badge-seco { color:#fbbf24; font-weight:700; }
    .cons-hint { font-size:.8rem; color:var(--c-muted); margin:0 0 .5rem; }
  
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print { display: none !important; }
      body.cons-page { background: #fff !important; margin: 0 !important; }
      .cons-head, .cons-card.no-print-section, .cons-hint, .cons-actions, .cons-toolbar-main,
      .cons-status, #consFile, #consFolder, .btn, select, .cons-fecha-badge, .cons-preview-empty { display: none !important; }
      .cons-wrap { max-width: none !important; padding: 0 !important; margin: 0 !important; }
      .cons-card { border: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
      h3 { display: none !important; }
      .cons-preview-wrap {
        max-height: none !important;
        overflow: visible !important;
        background: #fff !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .cons-preview-inner {
        display: block !important;
        gap: 0 !important;
        transform: none !important;
      }
      /* Cada bloque = 1 página física, igual que la vista previa */
      .print-page {
        box-shadow: none !important;
        width: 100% !important;
        max-width: none !important;
        min-height: 0 !important;
        max-height: none !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
        overflow: visible !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .print-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
      .print-header, .blk-tipo { page-break-after: avoid !important; break-after: avoid !important; }
      table { page-break-inside: avoid !important; }
      tr { page-break-inside: avoid !important; }
      thead { display: table-header-group !important; }
      @page { size: A4 portrait; margin: 8mm; }
    }

  
    .cons-pdf-frame { display:block; }
    @media print {
      .cons-pdf-frame { display: none !important; }
    }
  
    #consPreviewInner {
      position: fixed;
      left: 0;
      top: 0;
      width: 794px;
      background: #fff;
      color: #0f172a;
      z-index: -1;
      opacity: 0.01;
      pointer-events: none;
      overflow: visible;
    }
    #consPreviewInner .print-page {
      width: 190mm;
      background: #fff;
      padding: 6mm;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
  
    .cons-layout {
      display: flex;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }
    .cons-sidebar {
      width: 168px;
      flex-shrink: 0;
      background: var(--c-card);
      border-right: 1px solid var(--c-border);
      padding: .75rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: .65rem;
    }
    .cons-side-head h1 { margin: 0; font-size: 1.05rem; }
    .cons-side-block { display: flex; flex-direction: column; }
    .cons-main {
      flex: 1;
      min-width: 0;
      background: #3f3f46;
      display: flex;
      flex-direction: column;
    }
    .cons-pdf-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: #525659;
    }
    #consPreviewInner {
      position: fixed;
      left: 0;
      top: 0;
      width: 794px;
      background: #fff;
      color: #0f172a;
      z-index: -1;
      opacity: 0.01;
      pointer-events: none;
      overflow: visible;
    }
    #consPreviewInner .print-page {
      width: 190mm;
      background: #fff;
      padding: 5mm;
      box-sizing: border-box;
      margin-bottom: 6px;
    }
    @media (max-width: 720px) {
      .cons-layout { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
      .cons-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--c-border); }
      .cons-main { min-height: 70vh; }
      .cons-pdf-frame { min-height: 70vh; }
    }
  
    .cons-mode-tabs { display:flex; gap:.35rem; }
    .mode-tab {
      flex:1; cursor:pointer; border-radius:8px; border:1px solid var(--c-border);
      background:transparent; color:var(--c-muted); padding:.4rem .35rem; font-size:.75rem; font-weight:600;
    }
    .mode-tab.active { background:var(--c-pri); border-color:var(--c-pri); color:#fff; }
    .ruta-list { display:flex; flex-direction:column; gap:.6rem; max-width:900px; margin:0 auto; }
    .ruta-card {
      background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; padding:.75rem .9rem;
    }
    .ruta-card h4 { margin:0 0 .35rem; font-size:.95rem; }
    .ruta-card .meta { font-size:.78rem; color:var(--c-muted); }
    .ruta-card .geo-ok { color:#4ade80; }
    .ruta-card .geo-miss { color:#fbbf24; }
    .ruta-card a.maps-link {
      display:inline-block; margin-top:.4rem; font-size:.82rem; color:#38bdf8; text-decoration:none; font-weight:600;
    }
    .ruta-transport-head {
      display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap;
      background:var(--c-card); border:1px solid var(--c-border); border-radius:12px;
      padding:.65rem .85rem; margin:1rem 0 .5rem;
    }
    .ruta-transport-head .meta { font-size:.75rem; color:var(--c-muted); margin-top:.15rem; }
    .ruta-group-title {
      font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
      color:var(--c-muted); margin:1rem 0 .4rem;
    }
  </style>
</head>
<body class="cons-page">
  <div class="cons-layout">
    <aside class="cons-sidebar no-print">
      <div class="cons-side-head">
        <h1>📦 IEM Logística</h1>
        <div class="cons-status" id="consStatus" hidden></div>
      </div>
      <div class="cons-mode-tabs">
        <button type="button" class="mode-tab active" id="btnModeCarga" data-mode="carga">Carga PDF</button>
        <button type="button" class="mode-tab" id="btnModeRuta" data-mode="ruta">Ruta / Geo</button>
      </div>
      <button type="button" class="btn btn-outline btn-sm" id="btnConsTema" style="width:100%">Tema</button>

      <div class="cons-side-block">
        <div class="cons-fecha-badge" style="width:100%;justify-content:center;font-size:.78rem">
          📅 <span id="consFechaLabel">—</span>
        </div>
        <input type="hidden" id="consFecha" />
      </div>

      <div class="cons-side-block panel-carga" id="panelSideCarga">
        <label class="btn btn-primary btn-sm" style="cursor:pointer;width:100%;text-align:center;box-sizing:border-box">
          Excel de carga
          <input type="file" id="consFile" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden />
        </label>
        <label class="btn btn-outline btn-sm" style="cursor:pointer;width:100%;text-align:center;box-sizing:border-box;margin-top:.35rem">
          Carpeta
          <input type="file" id="consFolder" webkitdirectory directory multiple hidden />
        </label>
        <button type="button" class="btn btn-outline btn-sm" id="btnConsRefrescarCarpeta" style="width:100%;margin-top:.35rem">↻ Actualizar</button>
        <p class="cons-status" id="consImportStatus" hidden></p>
      </div>

      <div class="cons-side-block panel-carga">
        <label style="font-size:.78rem;color:var(--c-muted)">Camión</label>
        <select id="consCamion" style="width:100%;margin-top:.25rem">
          <option value="">Todos</option>
        </select>
        <select id="consFiltroCamion" hidden>
          <option value="">Todos los camiones</option>
        </select>
        <select id="consFiltroTipo" hidden>
          <option value="">Todos</option>
          <option value="FRIOS">Fríos</option>
          <option value="SECOS">Secos</option>
        </select>
      </div>

      <div class="cons-side-block panel-carga">
        <button type="button" class="btn btn-primary btn-sm" id="btnConsPrintUno" style="width:100%">PDF camión</button>
        <button type="button" class="btn btn-primary btn-sm" id="btnConsPrintMulti" style="width:100%;margin-top:.35rem">PDF todos</button>
      </div>

      <div class="cons-side-block panel-ruta" id="panelSideRuta" hidden>
        <label class="btn btn-primary btn-sm" style="cursor:pointer;width:100%;text-align:center;box-sizing:border-box">
          Liquidación / reparto
          <input type="file" id="rutaFile" accept=".xlsx,.xls,.xlsm,.csv" hidden />
        </label>
        <p class="cons-status" id="rutaImportStatus" style="font-size:.72rem;margin-top:.4rem">Excel cobranzas (CódigoCliente, Dirección, Camión, Vendedor)</p>
        <label style="font-size:.78rem;color:var(--c-muted);margin-top:.5rem">Transporte</label>
        <select id="rutaFiltro" style="width:100%;margin-top:.25rem">
          <option value="">Todos los transportes</option>
        </select>
        <button type="button" class="btn btn-outline btn-sm" id="btnRutaMiUbicacion" style="width:100%;margin-top:.5rem">📍 Usar mi ubicación</button>
        <p class="cons-status" id="rutaGeoYo" style="font-size:.7rem;margin-top:.25rem">Origen: aún no capturado</p>
        <button type="button" class="btn btn-primary btn-sm" id="btnRutaMaps" style="width:100%;margin-top:.45rem">Maps · transporte elegido</button>
        <button type="button" class="btn btn-outline btn-sm" id="btnRutaPublicar" style="width:100%;margin-top:.35rem">Publicar a vendedores</button>
        <p class="cons-status" id="rutaStats" style="font-size:.72rem;margin-top:.4rem"></p>
      </div>

      <p class="cons-status" id="consResumen" hidden></p>
      <p class="cons-status" id="consPdfStatus" hidden></p>
    </aside>

    <main class="cons-main">
      <div id="panelMainCarga" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <iframe id="consPdfFrame" title="Vista previa PDF" class="cons-pdf-frame"></iframe>
      </div>
      <div id="panelMainRuta" hidden style="flex:1;display:flex;flex-direction:column;min-height:0;background:var(--c-bg)">
        <div id="rutaMapWrap" class="ruta-map-wrap">
          <iframe id="rutaMapFrame" class="ruta-map-frame" title="Mapa de la ruta" src="about:blank"></iframe>
          <p id="rutaMapHint" class="ruta-map-hint">Sube la liquidación y elige un transporte para ver el mapa</p>
        </div>
        <div id="rutaList" class="ruta-list" style="padding:0.75rem 1rem 1.5rem;overflow:auto;flex:1"></div>
      </div>
    </main>
  </div>

  <div id="consPreviewInner" class="cons-preview-inner" aria-hidden="true"></div>
  <div class="cons-table-wrap" id="consTableWrap" hidden>
    <table class="cons-table" id="consTabla">
      <thead id="consThead"></thead>
      <tbody id="consTbody"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="consolidado.js"></script>
</body>
</html>
