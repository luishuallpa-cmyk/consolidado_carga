<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>IEM · Consolidado de carga</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="icon" href="logo-iem.png" sizes="32x32" />
  <style>
    :root { --c-bg:#0f172a; --c-card:#1e293b; --c-border:#334155; --c-text:#f1f5f9; --c-muted:#94a3b8; --c-pri:#3B6EA5; --c-ok:#16a34a; --c-bad:#dc2626; }
    body.cons-page { margin:0; background:var(--c-bg); color:var(--c-text); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; }
    body.cons-page.light-theme { --c-bg:#f8fafc; --c-card:#fff; --c-border:#e2e8f0; --c-text:#0f172a; --c-muted:#64748b; }
    .cons-wrap { max-width:1100px; margin:0 auto; padding:1rem 1rem 4rem; }
    .cons-head { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between; margin-bottom:1rem; }
    .cons-head h1 { margin:0; font-size:1.25rem; }
    .cons-card { background:var(--c-card); border:1px solid var(--c-border); border-radius:14px; padding:1rem; margin-bottom:1rem; }
    .cons-actions { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .cons-status { font-size:.85rem; color:var(--c-muted); margin:.35rem 0; }
    .btn { cursor:pointer; border-radius:10px; border:1px solid var(--c-border); background:transparent; color:var(--c-text); padding:.5rem .85rem; font:inherit; font-size:.88rem; }
    .btn-primary { background:var(--c-pri); border-color:var(--c-pri); color:#fff; font-weight:600; }
    .btn-outline { background:transparent; }
    .btn-sm { padding:.4rem .7rem; font-size:.82rem; }
    .btn-danger { border-color:var(--c-bad); color:#fecaca; }
    select { padding:.45rem .65rem; border-radius:10px; border:1px solid var(--c-border); background:var(--c-bg); color:var(--c-text); font:inherit; }
    .cons-fecha-badge { display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .75rem; border-radius:999px; background:rgba(59,110,165,.2); border:1px solid var(--c-pri); font-size:.85rem; font-weight:600; }
    .cons-toolbar-main { display:flex; flex-wrap:wrap; gap:.5rem; margin:.5rem 0; }
    .cons-table-wrap { overflow:auto; max-height:42vh; border:1px solid var(--c-border); border-radius:12px; }
    .cons-preview-wrap {
      overflow: auto;
      max-height: min(70vh, 900px);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      background: #525659;
      padding: 12px 8px 20px;
    }
    body.light-theme .cons-preview-wrap { background: #94a3b8; }
    .cons-preview-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transform-origin: top center;
    }
    .cons-preview-inner .print-page {
      width: 210mm;
      max-width: 100%;
      box-sizing: border-box;
      background: #fff;
      color: #0f172a;
      padding: 10mm 12mm;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      border-radius: 2px;
    }
    .cons-preview-empty {
      color: #e2e8f0;
      text-align: center;
      padding: 2.5rem 1rem;
      font-size: 0.9rem;
    }
    body.light-theme .cons-preview-empty { color: #0f172a; }

    .cons-table { width:100%; border-collapse:collapse; font-size:.82rem; }
    .cons-table th, .cons-table td { padding:.4rem .5rem; border-bottom:1px solid var(--c-border); text-align:left; white-space:nowrap; }
    .cons-table th { position:sticky; top:0; background:var(--c-card); z-index:1; }
    .badge-frio { color:#38bdf8; font-weight:700; }
    .badge-seco { color:#fbbf24; font-weight:700; }
    .cons-hint { font-size:.8rem; color:var(--c-muted); margin:0 0 .5rem; }
  
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print { display: none !important; }
      body.cons-page { background: #fff !important; margin: 0 !important; }
      .cons-head, .cons-card.no-print-section, .cons-hint, .cons-actions, .cons-toolbar-main,
      .cons-status, #consFile, #consFolder, .btn, select, .cons-fecha-badge, .cons-preview-empty { display: none !important; }
      .cons-wrap { max-width: none !important; padding: 0 !important; margin: 0 !important; }
      .cons-card { border: none !important; background: transparent !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
      h3 { display: none !important; }
      .cons-preview-wrap {
        max-height: none !important;
        overflow: visible !important;
        background: #fff !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .cons-preview-inner {
        display: block !important;
        gap: 0 !important;
        transform: none !important;
      }
      /* Cada bloque = 1 página física, igual que la vista previa */
      .print-page {
        box-shadow: none !important;
        width: 100% !important;
        max-width: none !important;
        min-height: 0 !important;
        max-height: none !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        border-radius: 0 !important;
        overflow: visible !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .print-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
      .print-header, .blk-tipo { page-break-after: avoid !important; break-after: avoid !important; }
      table { page-break-inside: avoid !important; }
      tr { page-break-inside: avoid !important; }
      thead { display: table-header-group !important; }
      @page { size: A4 portrait; margin: 8mm; }
    }

  
    .cons-pdf-frame { display:block; }
    @media print {
      .cons-pdf-frame { display: none !important; }
    }
  
    #consPreviewInner {
      position: fixed;
      left: 0;
      top: 0;
      width: 794px;
      background: #fff;
      color: #0f172a;
      z-index: -1;
      opacity: 0.01;
      pointer-events: none;
      overflow: visible;
    }
    #consPreviewInner .print-page {
      width: 190mm;
      background: #fff;
      padding: 6mm;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
  
    .cons-layout {
      display: flex;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }
    .cons-sidebar {
      width: 168px;
      flex-shrink: 0;
      background: var(--c-card);
      border-right: 1px solid var(--c-border);
      padding: .75rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: .65rem;
    }
    .cons-side-head h1 { margin: 0; font-size: 1.05rem; }
    .cons-side-block { display: flex; flex-direction: column; }
    .cons-main {
      flex: 1;
      min-width: 0;
      background: #3f3f46;
      display: flex;
      flex-direction: column;
    }
    .cons-pdf-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: #525659;
    }
    #consPreviewInner {
      position: fixed;
      left: 0;
      top: 0;
      width: 794px;
      background: #fff;
      color: #0f172a;
      z-index: -1;
      opacity: 0.01;
      pointer-events: none;
      overflow: visible;
    }
    #consPreviewInner .print-page {
      width: 190mm;
      background: #fff;
      padding: 5mm;
      box-sizing: border-box;
      margin-bottom: 6px;
    }
    @media (max-width: 720px) {
      .cons-layout { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
      .cons-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--c-border); }
      .cons-main { min-height: 70vh; }
      .cons-pdf-frame { min-height: 70vh; }
    }
  
    .cons-mode-tabs { display:flex; gap:.35rem; }
    .mode-tab {
      flex:1; cursor:pointer; border-radius:8px; border:1px solid var(--c-border);
      background:transparent; color:var(--c-muted); padding:.4rem .35rem; font-size:.75rem; font-weight:600;
    }
    .mode-tab.active { background:var(--c-pri); border-color:var(--c-pri); color:#fff; }
    .ruta-list { display:flex; flex-direction:column; gap:.6rem; max-width:900px; margin:0 auto; }
    .ruta-card {
      background:var(--c-card); border:1px solid var(--c-border); border-radius:12px; padding:.75rem .9rem;
    }
    .ruta-card h4 { margin:0 0 .35rem; font-size:.95rem; }
    .ruta-card .meta { font-size:.78rem; color:var(--c-muted); }
    .ruta-card .geo-ok { color:#4ade80; }
    .ruta-card .geo-miss { color:#fbbf24; }
    .ruta-card a.maps-link {
      display:inline-block; margin-top:.4rem; font-size:.82rem; color:#38bdf8; text-decoration:none; font-weight:600;
    }
    .ruta-transport-head {
      display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap;
      background:var(--c-card); border:1px solid var(--c-border); border-radius:12px;
      padding:.65rem .85rem; margin:1rem 0 .5rem;
    }
    .ruta-transport-head .meta { font-size:.75rem; color:var(--c-muted); margin-top:.15rem; }
    .ruta-group-title {
      font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
      color:var(--c-muted); margin:1rem 0 .4rem;
    }
    .ruta-map-wrap {
      position: relative;
      flex: 0 0 42vh;
      min-height: 220px;
      max-height: 440px;
      background: #2a2f3a;
      border-bottom: 1px solid var(--c-border);
    }
    .ruta-map-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 1;
      background: #1e293b;
    }
    .ruta-map-legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 500;
      background: rgba(15, 23, 42, 0.92);
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.72rem;
      line-height: 1.45;
      max-width: min(260px, 70%);
      box-shadow: 0 4px 14px rgba(0,0,0,.35);
      pointer-events: none;
    }
    body.light-theme .ruta-map-legend {
      background: rgba(255,255,255,0.95);
      color: #0f172a;
      border-color: #e2e8f0;
    }
    .ruta-map-legend b { display: block; margin-bottom: 4px; font-size: 0.78rem; }
    .ruta-map-legend .leg-row {
      display: flex; align-items: center; gap: 6px; margin: 2px 0;
    }
    .ruta-map-legend .leg-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.5);
    }
    .leaflet-popup-content { font-size: 0.82rem; line-height: 1.35; margin: 8px 10px; }
    .leaflet-popup-content b { font-size: 0.9rem; }
    .leaflet-container a.leaflet-popup-close-button { color: #64748b; }
    .ruta-map-hint {
      position: absolute;
      inset: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      color: var(--c-muted);
      font-size: .85rem;
      background: var(--c-card);
    }
    .ruta-map-wrap.has-map .ruta-map-hint { display: none; }

    .chooser-logo {
      height: 72px; width: auto; max-width: 160px; object-fit: contain;
      display: block; margin: 0 auto 0.35rem;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.25));
    }
    .chooser-brand { text-align: center; }
    .chooser-brand h1 { margin: 0.15rem 0 0.85rem; font-size: 1.4rem; letter-spacing: 0.02em; }
    
    .chooser-opt {
      min-height: 168px;
      padding: 1.1rem 0.9rem 1rem;
      gap: 0.45rem;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
      position: relative;
      overflow: hidden;
    }
    .chooser-opt .chooser-visual {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.15rem;
      transition: transform .22s ease;
    }
    .chooser-opt .chooser-visual svg {
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.28));
    }
    .chooser-opt:hover, .chooser-opt:focus-visible {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--c-pri);
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
      outline: none;
    }
    .chooser-opt:hover .chooser-visual,
    .chooser-opt:focus-visible .chooser-visual {
      transform: scale(1.08);
    }
    .chooser-opt:active {
      transform: translateY(-1px) scale(0.99);
    }
    .chooser-opt-carga:hover, .chooser-opt-carga:focus-visible {
      border-color: #3B6EA5;
      background: linear-gradient(160deg, rgba(59,110,165,.22), transparent 70%);
    }
    .chooser-opt-ruta:hover, .chooser-opt-ruta:focus-visible {
      border-color: #ef4444;
      background: linear-gradient(160deg, rgba(239,68,68,.18), transparent 70%);
    }
    .chooser-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .chooser-desc {
      font-size: 0.82rem;
      opacity: 0.9;
    }

    .side-brand {
      display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.55rem;
    }
    .side-logo {
      height: 40px; width: auto; max-width: 56px; object-fit: contain; flex-shrink: 0;
    }
    .side-brand-name {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      color: var(--c-muted); text-transform: uppercase;
    }
    .cons-side-head h1 {
      margin: 0; font-size: 1.05rem; font-weight: 700;
    }
    .step-label {
      display: flex; align-items: center; gap: 0.45rem;
      font-size: 0.78rem; font-weight: 700; color: var(--c-muted);
      margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .step-n {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.35rem; height: 1.35rem; border-radius: 999px;
      background: var(--c-pri); color: #fff; font-size: 0.75rem; font-weight: 800;
    }
    .cons-sidebar .btn {
      font-size: 0.9rem;
    }
    .cons-sidebar select {
      border-radius: 10px; border: 1px solid var(--c-border);
      background: var(--c-bg); color: var(--c-text); font: inherit;
    }


    /* Panel Google Maps: tramos + elegir parada */
    #rutaMapsOverlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(15,23,42,.65); align-items: flex-end; justify-content: center;
      padding: 0;
    }
    #rutaMapsOverlay.open { display: flex; }
    .ruta-maps-modal {
      width: min(520px, 100%);
      max-height: min(88vh, 720px);
      background: var(--c-card, #1e293b);
      color: var(--c-text, #f1f5f9);
      border-radius: 16px 16px 0 0;
      border: 1px solid var(--c-border, #334155);
      display: flex; flex-direction: column;
      box-shadow: 0 -8px 40px rgba(0,0,0,.4);
    }
    @media (min-width: 720px) {
      #rutaMapsOverlay { align-items: center; padding: 1rem; }
      .ruta-maps-modal { border-radius: 16px; max-height: 80vh; }
    }
    .ruta-maps-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; padding: .85rem 1rem; border-bottom: 1px solid var(--c-border, #334155);
    }
    .ruta-maps-hint {
      margin: 0; padding: .65rem 1rem; font-size: .78rem; color: var(--c-muted, #94a3b8);
      line-height: 1.35;
    }
    .ruta-maps-actions {
      display: flex; flex-wrap: wrap; gap: .4rem; padding: 0 1rem .65rem;
    }
    .ruta-maps-actions .btn { font-size: .78rem; }
    .ruta-maps-list {
      overflow: auto; flex: 1; padding: 0 .5rem .75rem;
      -webkit-overflow-scrolling: touch;
    }
    .ruta-maps-item {
      display: flex; align-items: center; gap: .55rem;
      padding: .55rem .65rem; margin: .25rem 0;
      border-radius: 10px; text-decoration: none;
      color: inherit; border: 1px solid var(--c-border, #334155);
      background: var(--c-bg, #0f172a);
    }
    .ruta-maps-item:active, .ruta-maps-item:hover {
      border-color: var(--c-pri, #3B6EA5);
      background: rgba(59,110,165,.15);
    }
    .ruta-maps-item .n {
      flex-shrink: 0; width: 1.5rem; height: 1.5rem; border-radius: 999px;
      background: var(--c-pri, #3B6EA5); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700;
    }
    .ruta-maps-item .txt { flex: 1; min-width: 0; }
    .ruta-maps-item .txt b { display: block; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ruta-maps-item .txt small { display: block; font-size: .72rem; color: var(--c-muted, #94a3b8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ruta-maps-item .go { flex-shrink: 0; font-size: .78rem; font-weight: 700; color: #38bdf8; }

    @media (max-width: 720px) {
      .ruta-map-wrap { flex-basis: 34vh; min-height: 180px; }
    }
  
    .cons-chooser {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.25rem;
      background: var(--c-bg);
    }
    .chooser-card {
      width: min(640px, 100%);
      background: var(--c-card);
      border: 1px solid var(--c-border);
      border-radius: 18px;
      padding: 1.5rem 1.35rem 1.35rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
      text-align: center;
    }
    .chooser-brand h1 { margin: 0.5rem 0 0.25rem; font-size: 1.35rem; }
    .chooser-brand p { margin: 0 0 1.25rem; color: var(--c-muted); font-size: 0.92rem; }
    .chooser-logo { height: 72px; width: auto; object-fit: contain; }
    .chooser-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    @media (min-width: 560px) {
      .chooser-grid { grid-template-columns: 1fr 1fr; }
    }
    .chooser-opt {
      cursor: pointer; text-align: left;
      border: 1px solid var(--c-border);
      background: color-mix(in srgb, var(--c-bg) 70%, var(--c-card));
      color: var(--c-text);
      border-radius: 14px;
      padding: 1rem 1rem 1.05rem;
      display: flex; flex-direction: column; gap: 0.35rem;
      transition: border-color .15s, transform .12s, box-shadow .15s;
      font: inherit;
    }
    .chooser-opt:hover, .chooser-opt:focus {
      border-color: var(--c-pri);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-pri) 35%, transparent);
      transform: translateY(-1px);
      outline: none;
    }
    .chooser-ico { font-size: 1.6rem; line-height: 1; }
    .chooser-title { font-weight: 700; font-size: 1rem; }
    .chooser-desc { font-size: 0.8rem; color: var(--c-muted); line-height: 1.35; }
    #consWorkspace[hidden] { display: none !important; }
    #consChooser[hidden] { display: none !important; }

    /* —— Modos: solo un módulo visible —— */
    body.mode-carga .panel-ruta,
    body.mode-carga #panelMainRuta { display: none !important; }
    body.mode-ruta .panel-carga,
    body.mode-ruta #panelMainCarga { display: none !important; }
    body.mode-carga #panelMainCarga { display: flex !important; }
    body.mode-ruta #panelMainRuta { display: flex !important; }

    .cons-sidebar {
      width: 200px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--c-card) 95%, #000) 0%, var(--c-card) 100%);
    }
    .cons-side-head h1 {
      margin: 0.15rem 0 0.35rem;
      font-size: 0.98rem;
      line-height: 1.25;
    }
    .cons-side-block {
      padding: 0.55rem 0;
      border-top: 1px solid color-mix(in srgb, var(--c-border) 80%, transparent);
    }
    .cons-side-block:first-of-type { border-top: none; }
    .cons-side-block .btn { border-radius: 10px; }
    .cons-side-block label.btn { margin: 0; }
    .cons-fecha-badge {
      background: color-mix(in srgb, var(--c-pri) 22%, transparent);
      border: 1px solid color-mix(in srgb, var(--c-pri) 55%, var(--c-border));
    }
    #btnVolverChooser {
      font-size: 0.78rem;
      opacity: 0.95;
    }
    .cons-main {
      background: #3f3f46;
    }
    body.mode-carga .cons-main {
      background: #404040;
    }
  </style>
</head>
<body class="cons-page">
  <!-- Ventana previa: elegir módulo -->
  <div id="consChooser" class="cons-chooser">
    <div class="chooser-card">
      <div class="chooser-brand">
        <img src="logo-iem.png" alt="IEM Group" class="chooser-logo" width="120" height="72"
          onerror="this.onerror=null;this.src='8y7D7.png'" />
        <h1>IEM Logística</h1>
      </div>
      <div class="chooser-grid">
        <button type="button" class="chooser-opt chooser-opt-carga" id="chooserCarga" data-go="carga">
          <span class="chooser-visual" aria-hidden="true">
            <svg viewBox="0 0 80 80" width="72" height="72">
              <defs>
                <linearGradient id="gCarga" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#3B6EA5"/>
                  <stop offset="100%" stop-color="#1e3a5f"/>
                </linearGradient>
              </defs>
              <rect x="14" y="22" width="52" height="40" rx="6" fill="url(#gCarga)"/>
              <rect x="20" y="16" width="40" height="10" rx="3" fill="#60a5fa"/>
              <path d="M28 38h24M28 46h18M28 54h12" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
              <circle cx="58" cy="54" r="12" fill="#16a34a"/>
              <path d="M52 54h12M58 48v12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="chooser-title">Consolidado de carga</span>
          <span class="chooser-desc">Excel → PDF por camión</span>
        </button>
        <button type="button" class="chooser-opt chooser-opt-ruta" id="chooserRuta" data-go="ruta">
          <span class="chooser-visual" aria-hidden="true">
            <svg viewBox="0 0 80 80" width="72" height="72">
              <defs>
                <linearGradient id="gRuta" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ef4444"/>
                  <stop offset="100%" stop-color="#b91c1c"/>
                </linearGradient>
              </defs>
              <path d="M18 58 C28 40, 36 48, 40 32 C44 18, 52 22, 62 20" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>
              <path d="M40 12c-8 0-14 6.2-14 14 0 10.5 14 26 14 26s14-15.5 14-26c0-7.8-6-14-14-14z" fill="url(#gRuta)"/>
              <circle cx="40" cy="26" r="5.5" fill="#fff"/>
              <circle cx="18" cy="58" r="5" fill="#22c55e" stroke="#fff" stroke-width="2"/>
              <circle cx="62" cy="20" r="5" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
            </svg>
          </span>
          <span class="chooser-title">Rutas</span>
          <span class="chooser-desc">Paradas · mapa · GPS</span>
        </button>
      </div>
      <button type="button" class="btn btn-outline btn-sm" id="chooserTema" style="margin-top:1.1rem">🌓 Tema</button>
    </div>
  </div>

  <div id="consWorkspace" class="cons-layout" hidden>
    <aside class="cons-sidebar no-print">
      <div class="cons-side-head">
        <div class="side-brand">
          <img src="logo-iem.png" alt="IEM" class="side-logo" onerror="this.onerror=null;this.src='8y7D7.png'" />
          <div>
            <div class="side-brand-name">IEM</div>
            <h1 id="consSideTitle">Carga</h1>
          </div>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="btnVolverChooser" style="width:100%">← Inicio</button>
        <div class="cons-status" id="consStatus" hidden></div>
      </div>

      <div class="cons-side-block">
        <div class="cons-fecha-badge" style="width:100%;justify-content:center">
          📅 <span id="consFechaLabel">—</span>
        </div>
        <input type="hidden" id="consFecha" />
      </div>

      <div class="cons-side-block panel-carga" id="panelSideCarga">
        <div class="step-label"><span class="step-n">1</span> Subir Excel</div>
        <label class="btn btn-primary" style="cursor:pointer;width:100%;text-align:center;box-sizing:border-box;padding:.65rem">
          📂 Elegir archivo
          <input type="file" id="consFile" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden />
        </label>
        <label class="btn btn-outline btn-sm" style="cursor:pointer;width:100%;text-align:center;box-sizing:border-box;margin-top:.4rem">
          Carpeta
          <input type="file" id="consFolder" webkitdirectory directory multiple hidden />
        </label>
        <button type="button" class="btn btn-outline btn-sm" id="btnConsRefrescarCarpeta" style="width:100%;margin-top:.35rem" title="Actualizar">↻</button>
        <p class="cons-status" id="consImportStatus" hidden></p>
      </div>

      <div class="cons-side-block panel-carga">
        <div class="step-label"><span class="step-n">2</span> Camión</div>
        <select id="consCamion" style="width:100%;padding:.55rem;font-size:.95rem">
          <option value="">Todos</option>
        </select>
        <select id="consFiltroCamion" hidden>
          <option value="">Todos los camiones</option>
        </select>
        <select id="consFiltroTipo" hidden>
          <option value="">Todos</option>
          <option value="FRIOS">Fríos</option>
          <option value="SECOS">Secos</option>
        </select>
      </div>

      <div class="cons-side-block panel-carga">
        <div class="step-label"><span class="step-n">3</span> Descargar</div>
        <button type="button" class="btn btn-primary" id="btnConsPrintUno" style="width:100%;padding:.65rem;font-weight:700">PDF camión</button>
        <button type="button" class="btn btn-outline" id="btnConsPrintMulti" style="width:100%;margin-top:.4rem;padding:.55rem">PDF todos</button>
        <button type="button" class="btn btn-outline btn-sm" id="btnConsTema" style="width:100%;margin-top:.5rem">🌓</button>
      </div>

      <div class="cons-side-block panel-ruta" id="panelSideRuta" hidden>
        <div class="step-label"><span class="step-n">1</span> Liquidación</div>
        <label class="btn btn-primary" style="cursor:pointer;width:100%;text-align:center;box-sizing:border-box;padding:.65rem">
          📂 Subir Excel
          <input type="file" id="rutaFile" accept=".xlsx,.xls,.xlsm,.csv" hidden />
        </label>
        <p class="cons-status" id="rutaImportStatus" hidden></p>

        <div class="step-label" style="margin-top:.75rem"><span class="step-n">2</span> Camión</div>
        <select id="rutaFiltro" style="width:100%;padding:.55rem;font-size:.95rem">
          <option value="">Todos</option>
        </select>

        <div class="step-label" style="margin-top:.75rem"><span class="step-n">3</span> Mapa</div>
        <button type="button" class="btn btn-outline" id="btnRutaMiUbicacion" style="width:100%;padding:.55rem">📍 Mi ubicación</button>
        <p class="cons-status" id="rutaGeoYo" hidden></p>
        <button type="button" class="btn btn-primary" id="btnRutaMaps" style="width:100%;margin-top:.4rem;padding:.65rem;font-weight:700">🗺️ Abrir ruta</button>
        <button type="button" class="btn btn-outline btn-sm" id="btnRutaPublicar" style="width:100%;margin-top:.4rem">Publicar</button>
        <p class="cons-status" id="rutaStats" style="font-size:.75rem;margin-top:.5rem;text-align:center"></p>
      </div>

      <p class="cons-status" id="consResumen" hidden></p>
      <p class="cons-status" id="consPdfStatus" hidden></p>
    </aside>

    <main class="cons-main">
      <div id="panelMainCarga" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <iframe id="consPdfFrame" title="Vista previa PDF" class="cons-pdf-frame"></iframe>
      </div>
      <div id="panelMainRuta" hidden style="flex:1;display:flex;flex-direction:column;min-height:0;background:var(--c-bg)">
        <div id="rutaMapWrap" class="ruta-map-wrap">
          <div id="rutaMap" class="ruta-map-frame" role="img" aria-label="Mapa de paradas de reparto"></div>
          <p id="rutaMapHint" class="ruta-map-hint">① Sube Excel  ·  ② Elige camión</p>
          <div id="rutaMapLegend" class="ruta-map-legend" hidden></div>
        </div>
        <div id="rutaList" class="ruta-list" style="padding:0.75rem 1rem 1.5rem;overflow:auto;flex:1"></div>
      </div>
    </main>
  </div>

  <div id="consPreviewInner" class="cons-preview-inner" aria-hidden="true"></div>
  <div class="cons-table-wrap" id="consTableWrap" hidden>
    <table class="cons-table" id="consTabla">
      <thead id="consThead"></thead>
      <tbody id="consTbody"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="consolidado.js"></script>
</body>
</html>
